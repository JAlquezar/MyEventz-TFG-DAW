services:
  db:
    image: mysql:8.0
    container_name: myeventz_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myeventz_db
      MYSQL_USER: myeventz_user
      MYSQL_PASSWORD: myeventz_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: myeventz_backend
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=myeventz_db;User=myeventz_user;Password=myeventz_password;CharSet=utf8mb4;
      - Firebase__ProjectId=myeventzaragoza
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: myeventz_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
